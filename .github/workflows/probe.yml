name: 取得テスト

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe.py
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取得テストを実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL_SHEET_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTsUr65zkeUa-BLk20VUzHMZ6FOxVlR-3gTuXBMUBBDUTxHt8aO8Gp07LxsaiDLiRbHC6ZjJcKpT273/pub?gid=0&single=true&output=csv
        run: python scripts/probe.py
      - name: 結果を probe-results ブランチに保存
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r probe_results/. /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "取得テスト結果 ${GITHUB_RUN_ID}"
          git push -f origin probe-results
